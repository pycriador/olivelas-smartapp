name: Deploy Olivelas SmartApp to GitHub Pages

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      VITE_BASE_PATH: /olivelas-smartapp/
      VITE_OUT_DIR: dist-pages
      VITE_USE_SUPABASE_DIRECT: "true"
      VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
      VITE_SUPABASE_KEY: ${{ secrets.VITE_SUPABASE_KEY }}
      VITE_SUPABASE_SCHEMA: ${{ secrets.VITE_SUPABASE_SCHEMA || 'olivelas_smartapp' }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: app_builder_engine/frontend/package-lock.json

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Install Frontend Dependencies
        working-directory: app_builder_engine/frontend
        run: npm install --legacy-peer-deps

      - name: Build Frontend for GitHub Pages (Supabase Schema olivelas_smartapp)
        working-directory: app_builder_engine/frontend
        run: |
          npm run build
          cp dist-pages/index.html dist-pages/404.html
          touch dist-pages/.nojekyll

      - name: Upload Pages Artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: app_builder_engine/frontend/dist-pages

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

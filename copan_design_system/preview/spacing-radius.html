<!doctype html><html><head><meta charset="utf-8"><title>Radius</title><link rel="stylesheet" href="_card.css"></head>
<body>
<div class="card">
  <div class="eyebrow">Border radius</div>
  <div style="display:flex; gap:16px; align-items:flex-end;">
    <div style="text-align:center;">
      <div style="width:72px; height:72px; background:#F56738; border-radius:0;"></div>
      <div class="token" style="margin-top:8px;">none · 0</div>
    </div>
    <div style="text-align:center;">
      <div style="width:72px; height:72px; background:#F56738; border-radius:4px;"></div>
      <div class="token" style="margin-top:8px;">xs · 4</div>
    </div>
    <div style="text-align:center;">
      <div style="width:72px; height:72px; background:#F56738; border-radius:8px;"></div>
      <div class="token" style="margin-top:8px;">sm · 8</div>
    </div>
    <div style="text-align:center;">
      <div style="width:72px; height:72px; background:#F56738; border-radius:12px;"></div>
      <div class="token" style="margin-top:8px;">md · 12</div>
    </div>
    <div style="text-align:center;">
      <div style="width:72px; height:72px; background:#F56738; border-radius:24px;"></div>
      <div class="token" style="margin-top:8px;">lg · 24</div>
    </div>
    <div style="text-align:center;">
      <div style="width:130px; height:48px; background:#F56738; border-radius:999px; display:flex; align-items:center; justify-content:center; color:#fff; font-size:13px; font-weight:600;">Pill button</div>
      <div class="token" style="margin-top:8px;">pill · 999</div>
    </div>
    <div style="text-align:center;">
      <div style="width:72px; height:72px; background:#F56738; border-radius:9999px;"></div>
      <div class="token" style="margin-top:8px;">circle</div>
    </div>
  </div>
</div>
</body></html>

<!doctype html><html><head><meta charset="utf-8"><title>Type — Display scale</title><link rel="stylesheet" href="_card.css"></head>
<body>
<div class="card" style="gap:12px;">
  <div class="eyebrow">Display · Inter Variable · -2% tracking · optical sizing</div>
  <div style="display:grid; grid-template-columns: 60px 1fr 90px; gap:8px 14px; align-items:baseline;">
    <span class="token">H1</span>
    <span style="font-family:Inter; font-variation-settings:'wght' 800, 'opsz' 40; font-size:40px; line-height:44px; letter-spacing:-0.02em;">Encontre seu próximo lar</span>
    <span class="token" style="text-align:right;">800 · 56/64</span>
    <span class="token">H2</span>
    <span style="font-family:Inter; font-variation-settings:'wght' 700, 'opsz' 32; font-size:32px; line-height:38px; letter-spacing:-0.01em;">Moradia sem complicação</span>
    <span class="token" style="text-align:right;">700 · 48/60</span>
    <span class="token">H3</span>
    <span style="font-family:Inter; font-variation-settings:'wght' 700, 'opsz' 24; font-size:22px; line-height:28px;">Um jeito novo de morar</span>
    <span class="token" style="text-align:right;">700 · 32/40</span>
    <span class="token">Italic</span>
    <span style="font-family:Inter; font-style:italic; font-variation-settings:'wght' 500, 'opsz' 22; font-size:18px; line-height:24px; color:var(--color-text-secondary);">Editorial emphasis · use sparingly</span>
    <span class="token" style="text-align:right;">500i · 18/24</span>
  </div>
</div>
</body></html>

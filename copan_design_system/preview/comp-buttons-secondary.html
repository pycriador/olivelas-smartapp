<!doctype html><html><head><meta charset="utf-8"><title>Button — Secondary</title><link rel="stylesheet" href="_card.css">
<style>
  .btn { font-family: Inter, sans-serif; font-weight: 500; font-size: 16px; line-height: 24px; height: 48px; padding: 0 24px; border-radius: 8px; display: inline-flex; align-items: center; justify-content: center; gap: 8px; cursor: pointer; white-space: nowrap; transition: background 150ms ease-out; box-sizing: border-box; }
  .btn.ctx { height: 32px; padding: 0 16px; font-size: 14px; line-height: 20px; gap: 6px; }
  .btn-secondary       { background: #FFFFFF; border: 1px solid #121619; color: #121619; }
  .btn-secondary:hover { background: #F2F4F8; }
  .btn-sec-press       { background: #E1E9EF; border: 1px solid #121619; color: #121619; }
  .btn-sec-disabled    { background: #FFFFFF; border: 1px solid #C1C7CD; color: #C1C7CD; cursor: not-allowed; }
  .btn-premium         { background: #121619; border: none; color: #E4B266; }
  .btn-premium:hover   { background: #343A3F; }
  .btn-sec-premium     { background: transparent; border: 1px solid #E4B266; color: #121619; }
  .state-label { font-size: 10px; font-weight: 700; letter-spacing: 0.08em; text-transform: uppercase; color: #697077; margin-bottom: 6px; }
  .state-row { display: flex; gap: 12px; align-items: flex-end; flex-wrap: wrap; }
  .state { display: flex; flex-direction: column; }
  .inverted-strip { background: #121619; padding: 16px 20px; border-radius: 8px; display: flex; gap: 12px; flex-wrap: wrap; }
  .btn-primary-inv     { background: #FFFFFF; color: #121619; border: none; }
  .btn-primary-inv:hover { background: #F2F4F8; }
  .btn-sec-inverted    { background: transparent; border: 1px solid #FFFFFF; color: #FFFFFF; }
  .btn-sec-inverted:hover { background: rgba(255,255,255,0.1); }
</style>
</head>
<body>
<div class="card">
  <div class="eyebrow">Button · Secondary · Default (48h)</div>

  <div class="state-row">
    <div class="state"><span class="state-label">Enabled</span><button class="btn btn-secondary">Cancelar</button></div>
    <div class="state"><span class="state-label">Hover</span><button class="btn btn-secondary" style="background:#F2F4F8;">Cancelar</button></div>
    <div class="state"><span class="state-label">Pressed</span><button class="btn btn-sec-press">Cancelar</button></div>
    <div class="state"><span class="state-label">Disabled</span><button class="btn btn-sec-disabled">Cancelar</button></div>
  </div>

  <div class="state-label" style="margin-top:4px;">Modifier · Premium · Sobre fundo</div>
  <div class="state-row">
    <button class="btn btn-premium">Loft Propriedade</button>
    <button class="btn btn-sec-premium">Agendar visita</button>
  </div>

  <div class="state-label" style="margin-top:4px;">Modifier · Inverted · Sobre fundo escuro</div>
  <div class="inverted-strip">
    <button class="btn btn-primary-inv">Conversar com especialista</button>
    <button class="btn btn-sec-inverted">Ver mais opções</button>
  </div>

  <div class="state-label" style="margin-top:4px;">Action Button (ícone)</div>
  <div class="state-row">
    <button class="btn btn-secondary" style="width:48px; padding:0;">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 0 0 0-7.78z"/></svg>
    </button>
    <button class="btn btn-secondary" style="width:48px; padding:0;">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="18" cy="5" r="3"/><circle cx="6" cy="12" r="3"/><circle cx="18" cy="19" r="3"/><line x1="8.59" y1="13.51" x2="15.42" y2="17.49"/><line x1="15.41" y1="6.51" x2="8.59" y2="10.49"/></svg>
    </button>
    <button class="btn ctx btn-secondary" style="width:32px; padding:0;">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 5v14"/><path d="M5 12h14"/></svg>
    </button>
  </div>

  <div class="caption" style="margin-top:8px;">
    Secondary · borda preta sólida, fundo branco. Pareado com Primary para ações de baixa ênfase (Cancelar, Voltar).
  </div>
</div>
</body></html>

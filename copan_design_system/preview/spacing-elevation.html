<!doctype html><html><head><meta charset="utf-8"><title>Elevation</title><link rel="stylesheet" href="_card.css"></head>
<body>
<div class="card" style="background:#F2F4F8; padding:24px 24px;">
  <div class="eyebrow" style="color:var(--color-text-tertiary);">Elevation · 6 steps</div>
  <div style="display:grid; grid-template-columns: repeat(6, 1fr); gap:14px;">
    <div style="text-align:center;">
      <div style="height:72px; background:#FFF; border-radius:12px; box-shadow: 0 1px 0 0 rgba(25,31,35,0.06);"></div>
      <div class="token" style="margin-top:10px;">flat · 1</div>
    </div>
    <div style="text-align:center;">
      <div style="height:72px; background:#FFF; border-radius:12px; box-shadow: 0 2px 6px 0 rgba(25,31,35,0.08);"></div>
      <div class="token" style="margin-top:10px;">raised · 2</div>
    </div>
    <div style="text-align:center;">
      <div style="height:72px; background:#FFF; border-radius:12px; box-shadow: 0 6px 16px -4px rgba(25,31,35,0.12);"></div>
      <div class="token" style="margin-top:10px;">overlay · 3</div>
    </div>
    <div style="text-align:center;">
      <div style="height:72px; background:#FFF; border-radius:12px; box-shadow: 0 8px 24px -6px rgba(25,31,35,0.16);"></div>
      <div class="token" style="margin-top:10px;">sticky · 4</div>
    </div>
    <div style="text-align:center;">
      <div style="height:72px; background:#FFF; border-radius:12px; box-shadow: 0 16px 32px -8px rgba(25,31,35,0.20);"></div>
      <div class="token" style="margin-top:10px;">temp-nav · 5</div>
    </div>
    <div style="text-align:center;">
      <div style="height:72px; background:#FFF; border-radius:12px; box-shadow: 0 24px 48px -12px rgba(25,31,35,0.24);"></div>
      <div class="token" style="margin-top:10px;">popout · 6</div>
    </div>
  </div>
</div>
</body></html>
